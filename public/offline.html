<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000080">
  <title>ऑफ़लाइन | Team SPS - सुरज प्रताप</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #020617 0%, #000080 50%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      background: #ffffff;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(255, 153, 51, 0.3);
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0.8rem;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    p {
      color: #cbd5e1;
      font-size: 0.925rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-retry {
      background: linear-gradient(135deg, #FF9933 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.4);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 20px -3px rgba(234, 88, 12, 0.5);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="/team-logo.png" alt="Team SPS Logo">
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      इंटरनेट कनेक्शन नहीं है (Offline)
    </div>
    <h1>आप ऑफ़लाइन हैं</h1>
    <p>कृपया अपना इंटरनेट कनेक्शन (Wi-Fi / मोबाइल डेटा) जांचें। पुनः ऑनलाइन आने पर पृष्ठ स्वतः लोड हो जाएगा।</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      पुनः प्रयास करें (Retry)
    </button>
    <div class="footer-note">
      Team SPS • Building the Future of Politics
    </div>
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
