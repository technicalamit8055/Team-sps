# Fly.io config for the WhatsApp (Baileys) receipt server.
#
# The Vercel frontend calls this over HTTPS; see docs/WHATSAPP_RECEIPTS.md.
# Rename `app` to something unique before the first deploy.

app = "team-sps-whatsapp"
primary_region = "sin"            # Singapore — nearest available region to India

[build]
  dockerfile = "Dockerfile"

[env]
  # Must point inside the mounted volume, or the session is lost on redeploy.
  WHATSAPP_AUTH_DIR = "/data/whatsapp_auth"
  WHATSAPP_COUNTRY_CODE = "91"
  WHATSAPP_MIN_GAP_MS = "2500"
  PORT = "8787"

# Session credentials live here. Without this the device must be re-linked
# after every deploy, restart, or host migration.
[[mounts]]
  source = "whatsapp_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true

  # CRITICAL: Baileys must hold its WebSocket open continuously. Stopping the
  # machine drops that socket, so WhatsApp sees the device go offline and
  # queued sends fail. This is the one setting that must not be "optimized"
  # into autostop to save money — it breaks the integration.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"              # unauthenticated liveness probe
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# 256 MB is enough for one Baileys socket and keeps this inside the monthly
# usage allowance. Raise to 512 only if you see OOM restarts in `fly logs`.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
