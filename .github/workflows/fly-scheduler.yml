name: Fly.io Machine Control (Manual)

on:
  # Allows manual triggering from GitHub web UI / GitHub Mobile anytime
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'status'
        options:
          - start
          - stop
          - restart
          - status

jobs:
  control-fly-machine:
    name: Fly.io Machine Control
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run Fly Machine Action
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP_NAME: 'team-sps-whatsapp'
        run: |
          # Ensure both 'fly' and 'flyctl' work in the runner environment
          if command -v flyctl &> /dev/null && ! command -v fly &> /dev/null; then
            sudo ln -s "$(which flyctl)" /usr/local/bin/fly
          fi

          ACTION="${{ github.event.inputs.action || 'status' }}"

          echo "Target App: $APP_NAME"
          echo "Trigger: ${{ github.event_name }}"
          echo "Action: $ACTION"

          # Get machine ID dynamically or fall back to known ID
          MACHINE_ID=$(flyctl machines list -a "$APP_NAME" --json | jq -r '.[0].id // empty')
          if [ -z "$MACHINE_ID" ]; then
            MACHINE_ID="e8207e7a257748"
          fi
          echo "Machine ID: $MACHINE_ID"

          case "$ACTION" in
            start)
              echo "Starting Fly machine $MACHINE_ID..."
              flyctl machine start "$MACHINE_ID" -a "$APP_NAME" || true
              ;;
            stop)
              echo "Stopping Fly machine $MACHINE_ID..."
              flyctl machine stop "$MACHINE_ID" -a "$APP_NAME" || true
              ;;
            restart)
              echo "Restarting Fly machine $MACHINE_ID..."
              flyctl machine restart "$MACHINE_ID" -a "$APP_NAME"
              ;;
            status)
              echo "Checking machine status..."
              ;;
            *)
              echo "Unknown action: $ACTION"
              exit 1
              ;;
          esac

          echo "--- Current Machine State ---"
          flyctl machine status "$MACHINE_ID" -a "$APP_NAME"
